name: Nightly content crawl

# Opens every lesson and problem page in a real browser against the
# production image and fails on anything that renders as an error (Mermaid,
# KaTeX, visualisations, exercises, quizzes) or throws. It takes about 20
# minutes, too long for every push, and content changes most between
# pushes' reviews, so it runs nightly and on demand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    name: Crawl every page (production image)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend
          POSTGRES_DB: ascend_crawl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascend" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ascend:nightly
          cache-from: type=gha
      - name: Start the image
        run: |
          docker run -d --name ascend --network host \
            -e DATABASE_URL=postgres://ascend:ascend@localhost:5432/ascend_crawl \
            -e PUBLIC_ORIGIN=http://localhost:8080 -e COOKIE_SECURE=true \
            ascend:nightly
          for i in $(seq 1 60); do curl -sf localhost:8080/api/readyz && exit 0; sleep 1; done
          docker logs ascend; exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Crawl
        run: npx playwright test e2e/crawl.spec.ts --project=desktop --reporter=line
        working-directory: web
        env:
          CRAWL: "1"
      - if: failure()
        run: docker logs ascend > server.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crawl-report
          path: |
            web/test-results/crawl.json
            server.log
          if-no-files-found: ignore
