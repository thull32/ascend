name: Dependabot auto-merge

# Patch and minor updates, and digest-only refreshes of pinned actions and
# base images, merge by themselves once every required CI check passes (the
# full suite, including end-to-end tests against the production image).
# Major versions wait for a person: they can change behaviour in ways tests
# do not catch, and some (Node, TypeScript) are adopted deliberately.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'thull32/ascend'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge unless the update is a major version
        # update-type is the highest change in the PR; it is empty for a
        # digest-only update.
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
