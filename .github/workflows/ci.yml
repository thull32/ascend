name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI builds and tests; it never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend
          POSTGRES_DB: ascend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascend" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ascend:ascend@localhost:5432/ascend_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Pinned by SHA, the action cannot read the toolchain from its ref.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The server embeds web/dist at compile time; a placeholder is enough for Rust CI.
      - run: mkdir -p web/dist && echo '<!doctype html><title>ci</title>' > web/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Validate curriculum (strict)
        run: cargo run -q -p ascend-core --example validate_content -- ./content
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (RustSec)
        run: cargo audit

  problems:
    name: Practice problems and quizzes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - run: python3 scripts/validate_problems.py
      # Quiz options must be in their canonical shuffled order, so correct
      # answers stay spread evenly across positions as quizzes are edited.
      - run: python3 scripts/shuffle_quiz_options.py --check
      - run: python3 scripts/quiz_stats.py

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    needs: [rust, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend
          POSTGRES_DB: ascend_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascend" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build -p ascend-api
      - name: Start the server
        env:
          DATABASE_URL: postgres://ascend:ascend@localhost:5432/ascend_e2e
          PUBLIC_ORIGIN: http://localhost:8080
        run: |
          ./target/debug/ascend-api > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/readyz && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test e2e/smoke.spec.ts
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            server.log
