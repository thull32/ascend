name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend
          POSTGRES_DB: ascend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascend" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ascend:ascend@localhost:5432/ascend_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The server embeds web/dist at compile time; a placeholder is enough for Rust CI.
      - run: mkdir -p web/dist && echo '<!doctype html><title>ci</title>' > web/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Validate curriculum (strict)
        run: cargo run -q -p ascend-core --example validate_content -- ./content

  problems:
    name: Practice problems (reference solutions pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - run: python3 scripts/validate_problems.py

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    needs: [rust, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend
          POSTGRES_DB: ascend_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascend" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ascend-api
      - name: Start the server
        env:
          DATABASE_URL: postgres://ascend:ascend@localhost:5432/ascend_e2e
          PUBLIC_ORIGIN: http://localhost:8080
        run: |
          ./target/debug/ascend-api > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/readyz && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test e2e/smoke.spec.ts
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            server.log
