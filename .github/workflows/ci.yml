name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI builds and tests; it never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend
          POSTGRES_DB: ascend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascend" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ascend:ascend@localhost:5432/ascend_test
      # Grading tests must run here, not skip for want of the runtimes.
      GRADER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Pinned by SHA, the action cannot read the toolchain from its ref.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The server embeds web/dist at compile time; a placeholder is enough for Rust CI.
      - run: mkdir -p web/dist && echo '<!doctype html><title>ci</title>' > web/dist/index.html
      # CPython and QuickJS for WASI, which the grader runs learner code in.
      # The script pins them by digest, so its hash is the cache key.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: grader
        with:
          path: runtimes/grader
          key: grader-${{ hashFiles('scripts/grader-runtimes.sh') }}
      - name: Fetch and prepare the grader runtimes
        if: steps.grader.outputs.cache-hit != 'true'
        run: |
          bash scripts/grader-runtimes.sh runtimes/grader
          cargo run -q -p ascend-api -- --prepare-grader runtimes/grader
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Validate curriculum (strict)
        run: cargo run -q -p ascend-core --example validate_content -- ./content
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies (RustSec)
        run: cargo audit

  problems:
    name: Practice problems and quizzes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - run: python3 scripts/validate_problems.py
      # Quiz options must be in their canonical shuffled order, so correct
      # answers stay spread evenly across positions as quizzes are edited.
      - run: python3 scripts/shuffle_quiz_options.py --check
      - run: python3 scripts/quiz_stats.py

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    # The end-to-end suite runs against the image that ships: release build,
    # embedded SPA and content, distroless runtime, APP_ENV=production (JSON
    # logs, secure cookies, strict content). A debug build would miss
    # anything that only differs there.
    name: Production image (build, end-to-end, graceful stop)
    runs-on: ubuntu-latest
    needs: [rust, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend
          POSTGRES_DB: ascend_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascend" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ascend:ci
          build-args: RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image
        # Host networking reaches the Postgres service on localhost. Chromium
        # treats http://localhost as secure, so production's Secure cookies work.
        run: |
          docker run -d --name ascend --network host \
            -e DATABASE_URL=postgres://ascend:ascend@localhost:5432/ascend_e2e \
            -e PUBLIC_ORIGIN=http://localhost:8080 -e COOKIE_SECURE=true \
            ascend:ci
          for i in $(seq 1 60); do
            if ready=$(curl -sf localhost:8080/api/readyz); then
              echo "$ready"
              # The image reports the commit it was built from.
              echo "$ready" | grep -q '"build":"${{ github.sha }}"' && exit 0
              echo "readyz does not report build ${{ github.sha }}"; exit 1
            fi
            sleep 1
          done
          docker logs ascend; exit 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test e2e/smoke.spec.ts
        working-directory: web
      - name: Stops gracefully on SIGTERM
        # The binary is PID 1 in a distroless image, so it must handle SIGTERM
        # itself: exit 0 well inside the grace period, having logged the drain.
        run: |
          start=$(date +%s)
          docker stop --time 30 ascend
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' ascend)
          echo "exit code $code after ${took}s"
          docker logs ascend 2>&1 | tail -5
          test "$code" = 0 && test "$took" -lt 25 && docker logs ascend 2>&1 | grep -q "shutdown complete"
      - if: failure()
        run: docker logs ascend > server.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            server.log
