# Railway config-as-code for the `ascend` service.
# https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run on boot before the server binds, so a passing readiness
# check means the schema is current and Postgres is reachable.
healthcheckPath = "/api/readyz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Let in-flight requests (including streaming AI replies) drain on redeploy.
overlapSeconds = 20
drainingSeconds = 30
