<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Ascend: the free, deep curriculum that takes working engineers to senior roles at top-tier companies. Data structures, algorithms, system design, networking, AI, and mock interviews, with live visualisations and in-browser coding." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Ascend</title>
    <script>
      try {
        const t = localStorage.getItem('ascend.theme');
        if (t === 'light' || (t !== 'dark' && !matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('light');
      } catch {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
