# cargo audit configuration (CI runs `cargo audit`).
[advisories]
ignore = [
    # libsqlite3-sys 0.37 (bundled SQLite CVE). It is in Cargo.lock only as an
    # optional dependency of sqlx-sqlite, which nothing enables: Ascend uses
    # Postgres, and `cargo tree --workspace --target all | grep sqlite` is
    # empty, so no SQLite is compiled. Drop this once sqlx moves to >= 0.39.
    "RUSTSEC-2026-0459",
]
