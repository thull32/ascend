[workspace]
members = ["crates/core", "crates/api", "migration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/thull32/ascend"

[workspace.dependencies]
# --- web ---
axum = { version = "0.8", features = ["macros", "http2"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-br", "compression-gzip", "set-header", "fs", "timeout", "request-id", "util", "limit", "normalize-path"] }
http = "1"
http-body-util = "0.1"
hyper = "1"

# --- async runtime ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-stream = "0.3"

# --- database ---
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# --- serialization / data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# --- errors / observability ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# --- security ---
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
secrecy = { version = "0.10", features = ["serde"] }
validator = { version = "0.21", features = ["derive"] }
governor = "0.10"

# --- content ---
include_dir = "0.7"
pulldown-cmark = "0.13"
gray_matter = "0.3"
regex = "1"

# --- http client / ai ---
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2"

# --- caching ---

# --- misc ---
dotenvy = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
[profile.dev.package."*"]
opt-level = 2
